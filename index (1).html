<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11172e"><title>The Familiar Chooses You — Moonlit Grimoire</title><style>
:root{color-scheme:dark;--navy:#11172e;--purple:#30204d;--gold:#d8b96d;--cream:#f3e8ce;--muted:#c4b5d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#36234e 0%,#11172e 55%,#090d1d);color:var(--cream);font-family:Georgia,'Times New Roman',serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.37;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#dfc689 1px,transparent 1px);background-size:103px 131px,147px 179px;background-position:8px 11px,76px 57px}main{max-width:680px;margin:0 auto;padding:28px 16px 70px;position:relative}.panel{background:linear-gradient(155deg,rgba(48,32,77,.98),rgba(18,23,46,.98));border:1px solid #a88a50;border-radius:22px;padding:clamp(22px,5vw,40px);box-shadow:0 20px 65px #05071480}.center{text-align:center}.moon{font-size:52px;line-height:1;color:var(--gold);text-shadow:0 0 24px #dcc48280}.eyebrow{color:var(--gold);font:700 11px/1.6 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase}h1,h2{font-weight:normal;line-height:1.17;margin:10px 0 18px}h1{font-size:clamp(34px,7vw,53px)}h2{font-size:clamp(27px,6vw,40px)}p{line-height:1.7;font-size:17px}em,.quote{color:#dfd1e7}.quote{font-style:italic}button{cursor:pointer;font:600 15px system-ui,sans-serif;border-radius:11px;min-height:49px;padding:13px 18px;border:1px solid #ae8e51}button.primary{background:linear-gradient(#eed798,#d4ae62);color:#211b32}button.secondary{background:#302443;color:#f5ebcf;border-color:#827094}button:focus-visible,input:focus-visible{outline:3px solid #f8dfa2;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.actions button{flex:1}.option{display:block;background:#ffffff0b;border:1px solid #7a658a;border-radius:13px;padding:15px 16px;margin:12px 0;cursor:pointer;line-height:1.5}.option:has(input:checked){background:#d8b96d23;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.option input{accent-color:var(--gold);margin-right:10px;transform:scale(1.1)}.option b{color:var(--gold)}.progress{font:12px system-ui,sans-serif;color:var(--muted);display:flex;justify-content:space-between;margin:0 0 9px}.bar{height:6px;background:#ffffff20;border-radius:20px;overflow:hidden;margin-bottom:30px}.bar>div{background:var(--gold);height:100%;transition:width .25s}.input{display:block;background:#16172d;color:var(--cream);border:1px solid #907e9a;border-radius:10px;padding:14px;width:100%;font-size:18px;margin:12px 0}label.caption{font:600 13px system-ui,sans-serif;color:var(--muted)}.sigil{font-size:112px;line-height:1.4;filter:drop-shadow(0 0 18px #e4be6555)}.result{border-top:1px solid #b5945e55;border-bottom:1px solid #b5945e55;margin:20px 0;padding:22px 5px}.cert{margin:20px auto;max-width:440px;min-height:360px;border:double 5px var(--gold);border-radius:14px;background:radial-gradient(circle at 50% 18%,#483566,#161b36 72%);padding:24px 20px;text-align:center;position:relative}.cert h3{font-size:25px;font-weight:normal;margin:8px 0;color:var(--cream)}.cert .animal{font-size:70px}.cert .small{font:11px system-ui,sans-serif;letter-spacing:2px;color:var(--gold)}.cert .name{font-size:25px;color:var(--cream);margin:10px 0}.cert .desc{font-size:15px;font-style:italic;line-height:1.5}.hint{font:12px/1.6 system-ui,sans-serif;color:#c9bdd6;margin-top:14px}.hide{display:none!important}.notice{border-left:3px solid var(--gold);padding:12px 15px;background:#e2c98912;font-size:14px;line-height:1.5}.footer{text-align:center;color:#afa0c0;font:12px system-ui,sans-serif;margin-top:24px}@media(max-width:480px){.panel{padding:22px 18px}.actions{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main><section class="panel" id="app" aria-live="polite"></section><div class="footer">Moonlit Grimoire · Design Your Familiar · Test edition</div></main><script>
'use strict';
const animals=['Cat','Owl','Snake','Rabbit','Wolf','Phoenix','Unicorn','Raven','Fox','Toad','Dragon','Moth'];
const profiles={
Cat:['The Intuitive Spirit','Independent, perceptive, and quietly confident. Your magic follows instinct rather than rules.','🐈'],
Owl:['The Keeper of Wisdom','Thoughtful, observant, and patient. You discover answers that others overlook.','🦉'],
Snake:['The Spirit of Transformation','Adaptable, perceptive, and unafraid of change. You find strength in reinvention.','🐍'],
Rabbit:['The Gentle Survivor','Resourceful, sensitive, and quick-thinking. Your gentle nature conceals remarkable resilience.','🐇'],
Wolf:['The Loyal Guardian','Devoted, courageous, and protective. Your greatest magic grows from the bonds you cherish.','🐺'],
Phoenix:['The Eternal Flame','Passionate, resilient, and hopeful. Even after hardship, your spirit rises brighter.','🔥'],
Unicorn:['The Pure Heart','Compassionate, idealistic, and healing. You find magic in kindness and possibility.','🦄'],
Raven:['The Seeker of Secrets','Clever, curious, and unconventional. You are drawn to mysteries waiting to be uncovered.','🐦‍⬛'],
Fox:['The Clever Trickster','Playful, inventive, and quick-witted. You find unexpected paths where others see obstacles.','🦊'],
Toad:['The Earthbound Alchemist','Grounded, patient, and quietly powerful. You recognize extraordinary magic in ordinary things.','🐸'],
Dragon:['The Fierce Protector','Bold, determined, and fiercely devoted. Your magic burns strongest when something matters deeply.','🐉'],
Moth:['The Moonlit Dreamer','Imaginative, sensitive, and mysterious. You follow quiet wonders and trust the unseen.','🦋']};
const q=[
['The Door That Wasn\'t There','You wake to discover a tiny glowing door in your bedroom wall. It wasn\'t there yesterday. When you open it, you find four impossible worlds. Which do you enter?', ['An upside-down city where cats speak and everyone trades secrets.','An ancient library where the books float and whisper forgotten spells.','A moonlit garden where the flowers bloom whenever someone laughs.','A castle floating above a sea of clouds, guarded by enormous magical creatures.']],
['The Witch in the Mirror','While brushing your hair, your reflection suddenly winks at you and steps out of the mirror. She offers to trade places with you for one day. What do you do?', ['Agree, but secretly follow her to see what she\'s really planning.','Refuse until she explains exactly who she is and where she came from.','Invite her to breakfast. Surely she has an interesting story!','Accept immediately. You\'ve always wondered what another version of your life would be like.']],
['The Enchanted Market','At a hidden midnight market, a mysterious merchant offers you one item for free. Which do you take?', ['A pocket watch that lets you revisit one perfect moment.','A tiny glass bottle containing a storm that obeys your commands.','A silver bell that summons help whenever someone you love is in danger.','A map that redraws itself to reveal places nobody has ever discovered.']],
['The Spell Gone Wrong','You\'re brewing a potion when it suddenly erupts in glittering purple smoke. Your entire kitchen comes alive! The teapot is singing, the chairs are dancing, and the broom is trying to escape. What do you do?', ['Laugh and join the chaos. You might as well enjoy it!','Grab your spellbook and work backward to discover what happened.','Calm the enchanted objects before someone gets hurt.','Experiment with another spell. Surely two wrong spells could make one right!']],
['The Forgotten Familiar','Deep in an enchanted forest, you discover a small creature trapped inside a crystal. A note warns that releasing it could unleash unpredictable magic. What do you do?', ['Study the crystal and search for a way to free it safely.','Break the crystal immediately. Nothing deserves to be trapped.','Speak gently to the creature and try to understand its story.','Find the witch who created the spell and demand an explanation.']],
['The Midnight Masquerade','You receive an invitation to a magical masquerade where every guest must conceal their identity. At midnight, everyone\'s mask will reveal something about their true nature. What do you do?', ['Spend the evening secretly figuring out who\'s behind each mask.','Dance with strangers and enjoy the mystery.','Make sure the shy guests feel welcome and included.','Wait eagerly for midnight. You\'re curious what your own mask will reveal.']],
['The Whispering Woods','During a moonlit walk, the trees suddenly begin whispering your name. Four paths illuminate before you. Which do you follow?', ['The path lined with glowing mushrooms and mischievous woodland spirits.','The path beneath silver branches where ancient voices share forgotten wisdom.','The path through a peaceful meadow where magical animals gather.','The path toward a distant mountain crackling with wild elemental magic.']],
['The Dragon\'s Bargain','An ancient dragon offers you one wish, but you must give up something in return. Which bargain would you accept?', ['The power to see the future, but never reveal what you\'ve seen.','The ability to heal others, but only when you sacrifice something precious.','The gift of limitless adventure, but never visit the same magical place twice.','The strength to protect your loved ones, but your magic must remain secret.']],
['The Mysterious Hatchling','A strange egg appears on your doorstep. It shivers, glows, and occasionally makes tiny thunderclaps. Nobody knows what\'s inside. What do you do?', ['Create a cozy nest and care for it until it hatches.','Research magical eggs to discover what creature it might contain.','Take it somewhere safe and magically protected.','Stay up all night watching it, excited to meet whatever emerges.']],
['The Stolen Moonlight','One evening, the moon disappears. A mischievous spirit admits to stealing its light and hiding it in one of four places. Where do you search first?', ['The spirit\'s own home. Mischief often hides in plain sight.','An abandoned observatory filled with celestial charts.','A quiet pond where the moon\'s reflection once shimmered.','The highest mountain, where magic is strongest.']],
['The Coven\'s Secret','You discover that your coven has guarded an ancient magical secret for centuries. You\'re finally allowed to learn it, but doing so comes with responsibility. What do you hope the secret reveals?', ['A hidden passage connecting magical worlds.','The true history of witches and their forgotten ancestors.','A powerful spell capable of healing broken hearts.','A legendary source of magic that could protect the entire coven.']],
['The Familiar\'s Final Test','At last, you arrive in a moonlit clearing. Twelve pairs of glowing eyes watch you from the shadows. A mysterious voice says: “One of us has been waiting for you. Show us who you truly are.” What do you do?', ['Step forward quietly and trust that the right creature will recognize you.','Ask the creatures what they need from a witch before choosing.','Kneel down, extend your hand, and let one approach when it\'s ready.','Smile and say, “Well, what are we waiting for? Let\'s make some magic!”']]
];
const key=[
[['Moth','Cat','Fox'],['Phoenix','Snake','Owl'],['Rabbit','Toad','Unicorn'],['Wolf','Raven','Dragon']],
[['Rabbit','Snake','Cat'],['Dragon','Owl','Raven'],['Wolf','Unicorn','Fox'],['Phoenix','Toad','Moth']],
[['Raven','Cat','Rabbit'],['Dragon','Phoenix','Moth'],['Unicorn','Wolf','Snake'],['Toad','Fox','Owl']],
[['Fox','Raven','Phoenix'],['Owl','Snake','Toad'],['Moth','Rabbit','Wolf'],['Cat','Dragon','Unicorn']],
[['Unicorn','Raven','Owl'],['Cat','Phoenix','Wolf'],['Dragon','Moth','Rabbit'],['Snake','Toad','Fox']],
[['Snake','Raven','Cat'],['Fox','Unicorn','Moth'],['Phoenix','Toad','Rabbit'],['Dragon','Owl','Wolf']],
[['Wolf','Rabbit','Fox'],['Raven','Snake','Toad'],['Moth','Unicorn','Owl'],['Dragon','Cat','Phoenix']],
[['Raven','Moth','Fox'],['Owl','Unicorn','Rabbit'],['Cat','Toad','Dragon'],['Wolf','Phoenix','Snake']],
[['Rabbit','Raven','Toad'],['Unicorn','Snake','Dragon'],['Moth','Wolf','Cat'],['Fox','Owl','Phoenix']],
[['Fox','Owl','Cat'],['Moth','Raven','Snake'],['Toad','Wolf','Unicorn'],['Dragon','Phoenix','Rabbit']],
[['Fox','Snake','Cat'],['Raven','Owl','Moth'],['Unicorn','Rabbit','Phoenix'],['Dragon','Toad','Wolf']],
[['Cat','Moth','Toad'],['Unicorn','Phoenix','Raven'],['Owl','Rabbit','Wolf'],['Snake','Fox','Dragon']]];
// Validate the hidden scoring structure when the page starts.
for(const row of key){if(row.length!==4||row.some(a=>a.length!==3)||new Set(row.flat()).size!==12||row.flat().some(a=>!animals.includes(a)))throw new Error('Scoring key is invalid');}
let stage='intro',which=0,answers=Array(12).fill(null),witch='',winner=null,tied=[];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function topScroll(){window.scrollTo({top:0,behavior:'instant'});}function render(){let html='';
if(stage==='intro')html=`<div class="center"><div class="moon" aria-hidden="true">☾</div><p class="eyebrow">The Moonlit Grimoire</p><h1>The Familiar Chooses You</h1><p class="quote">On the night of the thirteenth moon, a mysterious letter appears at your doorstep. The wax seal bears the image of an animal you've never seen before.</p><p class="quote">“Your familiar is waiting. But first, the magic must discover who you truly are.”</p></div><label class="caption" for="witch">Your witch name</label><input class="input" id="witch" maxlength="45" placeholder="Enter your name" value="${esc(witch)}" autocomplete="off"><div class="actions"><button class="primary" id="begin">Begin the Calling ✦</button></div><p class="hint">12 magical scenarios · No account needed · Your responses remain in this browser session. The certificate can be saved to your device.</p>`;
if(stage==='questions'){const v=q[which];html=`<div class="progress"><span>Magical trial ${which+1} of 12</span><span>${Math.round((which+1)/12*100)}%</span></div><div class="bar"><div style="width:${(which+1)/12*100}%"></div></div><p class="eyebrow">The familiar chooses you</p><h2>${esc(v[0])}</h2><p>${esc(v[1])}</p><div role="radiogroup" aria-label="Choose one answer">${v[2].map((a,i)=>`<label class="option"><input type="radio" name="choice" value="${i}" ${answers[which]===i?'checked':''}><b>${'ABCD'[i]}.</b> ${esc(a)}</label>`).join('')}</div><div class="actions"><button class="secondary" id="back">${which===0?'Introduction':'Previous trial'}</button><button class="primary" id="next" ${answers[which]===null?'disabled':''}>${which===11?'Complete the Calling':'Next trial'} →</button></div>`;}
if(stage==='tie'){html=`<div class="center"><div class="moon">✧</div><p class="eyebrow">The Familiar's Final Calling</p><h2>More than one spirit answers.</h2><p>Several creatures have heard your magic. Read the following vows and choose the one that speaks to you most deeply. Only then will the creature reveal itself.</p></div>${tieOrder().map(a=>`<button class="option" style="width:100%;text-align:left;font-family:Georgia,serif;font-weight:normal;color:var(--cream);font-size:16px" data-tie="${esc(a)}">${esc(vows[a])}</button>`).join('')}<p class="hint">These options correspond only to your tied familiars. Their identities remain hidden until you choose.</p><div class="actions"><button class="secondary" id="backtie">Review my answers</button></div>`;}
if(stage==='result'){const p=profiles[winner];html=`<div class="center"><div class="moon">☾ ✦</div><p class="eyebrow">The familiar has answered</p><h1>${esc(winner)}</h1><div class="sigil" role="img" aria-label="${esc(winner)} symbol">${p[2]}</div><h2>${esc(p[0])}</h2><div class="result"><p class="quote">“${esc(p[1])}”</p></div><p>By moonlight and the bonds of the coven, <strong>${esc(witch)}</strong>, your familiar has found you.</p><p>Return to your traveling grimoire to roll the dice and discover your companion's appearance, quirks, powers, and name.</p></div><div class="cert" id="preview"><div class="moon" style="font-size:27px">☾</div><p class="small">THE MOONLIT GRIMOIRE</p><h3>Certificate of Familiar Bond</h3><div class="name">${esc(witch)}</div><div class="animal">${p[2]}</div><h3>${esc(winner)}</h3><div class="desc">${esc(p[1])}</div></div><div class="actions"><button class="primary" id="download">Save certificate as PNG ↓</button><button class="secondary" id="again">Start a new calling</button></div><p class="hint">Preview artwork uses symbolic animal icons in this test version. Final illustrated portraits can be added after artwork approval.</p>`;}
app.innerHTML=html;attach();}
const vows={Cat:'I trust the quiet truth within me, even when no one else can see it.',Owl:'I will listen, observe, and seek the wisdom hidden between words.',Snake:'I welcome the unknown, for every change contains a new beginning.',Rabbit:'I will meet uncertainty with gentleness, resourcefulness, and heart.',Wolf:'I will stay beside those I love, no matter how dark the path becomes.',Phoenix:'I will rise from every ending and carry hope into what comes next.',Unicorn:'I will choose compassion, even when the world forgets its magic.',Raven:'I will follow the unanswered question wherever it may lead.',Fox:'I will find another way when the obvious path is closed.',Toad:'I will honor the small, enduring wonders that others overlook.',Dragon:'I will stand with courage for the people and promises I cherish.',Moth:'I will follow the soft light of wonder through even the darkest night.'};
function tieOrder(){const shift=answers.reduce((s,n,i)=>s+(n+1)*(i+3),0)%tied.length;return tied.slice(shift).concat(tied.slice(0,shift));}
function calc(){const s=Object.fromEntries(animals.map(a=>[a,0]));answers.forEach((a,i)=>key[i][a].forEach(an=>s[an]++));const max=Math.max(...Object.values(s));tied=animals.filter(a=>s[a]===max);return s;}
function finish(){calc();if(tied.length===1){winner=tied[0];stage='result';}else stage='tie';render();topScroll();}
function attach(){if(stage==='intro'){document.getElementById('begin').onclick=()=>{witch=document.getElementById('witch').value.trim();if(!witch){document.getElementById('witch').focus();return;}which=0;stage='questions';render();topScroll();};}
if(stage==='questions'){document.querySelectorAll('input[name=choice]').forEach(el=>el.onchange=()=>{answers[which]=Number(el.value);document.getElementById('next').disabled=false;});document.getElementById('back').onclick=()=>{if(which===0)stage='intro';else which--;render();topScroll();};document.getElementById('next').onclick=()=>{if(answers[which]===null)return;if(which<11){which++;render();topScroll();}else finish();};}
if(stage==='tie'){document.querySelectorAll('[data-tie]').forEach(el=>el.onclick=()=>{winner=el.dataset.tie;stage='result';render();topScroll();});document.getElementById('backtie').onclick=()=>{stage='questions';which=11;render();topScroll();};}
if(stage==='result'){document.getElementById('download').onclick=downloadCert;document.getElementById('again').onclick=()=>{stage='intro';which=0;answers=Array(12).fill(null);winner=null;tied=[];witch='';render();topScroll();};}}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();}
function wrap(ctx,text,x,y,maxW,lineH){const words=text.split(' ');let line='';for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>maxW&&line){ctx.fillText(line,x,y);y+=lineH;line=word;}else line=next;}if(line)ctx.fillText(line,x,y);return y+lineH;}
function downloadCert(){const w=1000,h=1400,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const c=canvas.getContext('2d'),p=profiles[winner];const gradient=c.createRadialGradient(500,300,100,500,800,1000);gradient.addColorStop(0,'#483566');gradient.addColorStop(1,'#11172e');c.fillStyle=gradient;c.fillRect(0,0,w,h);c.strokeStyle='#d8b96d';c.lineWidth=9;rounded(c,45,45,910,1310,24);c.lineWidth=2;rounded(c,70,70,860,1260,18);for(let i=0;i<75;i++){const x=(i*193+43)%850+75,y=(i*317+71)%1140+90;c.fillStyle=i%3?'#c6b4dc':'#d8b96d';c.beginPath();c.arc(x,y,i%4===0?2.5:1.5,0,Math.PI*2);c.fill();}c.textAlign='center';c.fillStyle='#d8b96d';c.font='96px Georgia';c.fillText('☾',500,225);c.font='bold 24px Arial';c.fillText('THE MOONLIT GRIMOIRE',500,310);c.fillStyle='#f3e8ce';c.font='52px Georgia';c.fillText('Certificate of Familiar Bond',500,385);c.fillStyle='#d8b96d';c.font='24px Arial';c.fillText('THIS BOND IS BESTOWED UPON',500,465);c.fillStyle='#f3e8ce';c.font='bold 55px Georgia';wrap(c,witch,500,545,790,65);c.font='230px "Apple Color Emoji","Segoe UI Emoji",sans-serif';c.fillText(p[2],500,830);c.fillStyle='#d8b96d';c.font='bold 62px Georgia';c.fillText(winner.toUpperCase(),500,940);c.fillStyle='#f3e8ce';c.font='italic 34px Georgia';c.fillText(p[0],500,1002);c.font='italic 29px Georgia';wrap(c,p[1],500,1092,760,43);c.fillStyle='#d8b96d';c.font='24px Georgia';c.fillText('✧ YOUR BOND HAS BEEN WRITTEN AMONG THE STARS ✧',500,1270);const a=document.createElement('a');a.download='Familiar_Certificate_'+winner+'.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();}
render();
</script></body></html>
